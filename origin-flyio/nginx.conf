# 🧩 Origin server block — this is the Fly.io "origin" in the worked example.
# Cloudflare's edge connects to THIS server over HTTPS using the Origin CA
# cert below. Fly just passes the raw TCP through (see ../scripts/04-install-cert-flyio-origin.sh
# and fly.origin.toml) — nginx, not Fly, terminates TLS.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # Optional, recommended in production: only accept Cloudflare's client cert
    # ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    # ssl_verify_client optional;

    location / {
        default_type text/plain;
        return 200 "✅ Hello from the origin — this response was served over TLS using the Cloudflare Origin CA certificate.\n";
    }
}
